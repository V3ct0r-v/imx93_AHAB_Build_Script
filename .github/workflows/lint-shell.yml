name: Shell Lint

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bash Syntax Check
        run: bash -n imx93_secureboot.sh

      - name: ShellCheck
        run: shellcheck imx93_secureboot.sh
